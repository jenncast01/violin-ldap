services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    hostname: ldap.example.com
    environment:
      LDAP_ORGANISATION: "Example Corp"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "adminpassword"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks:
      - ldap-network

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    hostname: phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8085:80"
    depends_on:
      - openldap
    networks:
      - ldap-network

  api:
    build: ./fastapi
    container_name: ldap-api
    ports:
      - "8000:8000"
    environment:
      LDAP_HOST: openldap
      LDAP_PORT: "389"
      LDAP_BASE_DN: "dc=example,dc=com"
    env_file:
      - .env
    depends_on:
      - openldap
    networks:
      - ldap-network
    cap_add:
      - NET_ADMIN
      - NET_RAW

  nuclei:
    image: projectdiscovery/nuclei:latest
    container_name: nuclei-ldap-scanner
    profiles:
      - scan
    volumes:
      - ./reports:/reports
    networks:
      - ldap-network
    entrypoint: ["nuclei"]
    command:
      - "-target"
      - "http://api:8000"
      - "-severity"
      - "info,low,medium,high,critical"
      - "-jsonl-export"
      - "/reports/nuclei-results.jsonl"

volumes:
  ldap_data:
  ldap_config:

networks:
  ldap-network:
