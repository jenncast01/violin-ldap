[Definition]
# Detecta intentos de conexión o bind fallidos al puerto LDAP/LDAPS.
# OpenLDAP registra errores de bind con "BIND" y código de resultado 49 (Invalid credentials)
# o intentos de conexión TLS rechazados.
# Ejemplo de línea de log de slapd:
#   slapd[1234]: conn=1 fd=12 ACCEPT from IP=192.168.1.5:54321 (IP=0.0.0.0:636)
#   slapd[1234]: conn=1 op=0 BIND dn="uid=hacker,ou=users,dc=example,dc=com" method=128
#   slapd[1234]: conn=1 op=0 RESULT tag=97 err=49 text=
failregex = ^.* ACCEPT from IP=<HOST>:\d+ \(IP=\S+:636\)$
            ^.* ACCEPT from IP=<HOST>:\d+ \(IP=\S+:389\)$
ignoreregex =
